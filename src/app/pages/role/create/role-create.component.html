<div class="card">
    <div class="flex justify-center align-items-center mb-4">
        <button pButton class="p-button-outlined w-full sm:w-auto flex-order-0 p-button-secondary mr-4" icon="pi pi-arrow-left" label="{{'general.back' | translate}}" (click)="navigateToRoleList()"></button>
        <span class="text-900 text-xl font-bold block">{{'role.create' | translate}}</span>
    </div>
    <div class="grid">
        <div class="col-12 lg:col-2">
            <div class="text-900 font-medium text-xl mb-3">{{'role.title' | translate}}</div>
        </div>
        <div class="col-12 lg:col-10">
            <form [formGroup]="ngForm" (ngSubmit)="onSubmit()">
                <div class="grid formgrid p-fluid">
                    <app-form [form]="ngForm"></app-form>

                    <div class="col-12">
                        <button pButton pRipple label="{{'role.create' | translate}}" class="w-auto mt-3"></button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
