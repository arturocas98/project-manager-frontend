  <p-card
    class="project-card group cursor-pointer transition-all duration-300 hover:shadow-xl hover:-translate-y-1 surface-card"
    [style]="{ overflow: 'hidden' }">

    <!-- Header -->
    <ng-template pTemplate="header">
      <div class="relative p-6" [ngClass]="getHeaderColorClass(project.id)">

        <!-- Patrón decorativo -->
        <div class="absolute inset-0 opacity-10"
             style="background-image: radial-gradient(circle at 2px 2px, #ffffff 1px, transparent 0);
                    background-size: 24px 24px;">
        </div>

        <div class="relative flex justify-content-center">
          <div class="transform transition-transform duration-300 group-hover:scale-110 group-hover:rotate-3">
            <p-avatar
              label="{{ project.name.charAt(0) || '?' }}"
              shape="circle"
              [style]="{
                backgroundColor: 'var(--surface-card)',
                color: getAvatarTextColor(project.id),
                fontWeight: 'bold',
                fontSize: '2.5rem',
                width: '6rem',
                height: '6rem'
              }"
              class="shadow-lg">
            </p-avatar>
          </div>
        </div>

        <div class="absolute top-3 right-3">
          <span class="flex align-items-center px-4 py-2 rounded-full border-round text-base font-bold surface-card"
                [ngClass]="getBadgeTextColor(project.id)">
            {{ project.key }}
          </span>
        </div>
      </div>
    </ng-template>

    <!-- Content -->
    <div class="content">

      <h4 class="text-2xl font-bold text-color mb-2 line-clamp-1 transition-colors"
          [ngClass]="getHoverTextColor(project.id)">
        {{ project.name }}
      </h4>

      <p class="description text-base text-color-secondary line-clamp-2 leading-relaxed min-h-[3rem]">
        {{ project.description || 'Sin descripción' }}
      </p>

      <div class="mt-4 space-y-3">

        <div *ngIf="project.created_by"
             class="flex items-center gap-3 text-base text-color">
          <div class="w-2rem h-2rem border-round-3xl flex align-items-center justify-content-center"
               [ngClass]="getIconBgColor(project.id)">
            <i class="ph ph-user-circle text-xl"
               [ngClass]="getIconColor(project.id)"></i>
          </div>
          <span>Creado por:
            <span class="font-semibold">{{ project.created_by.name }}</span>
          </span>
        </div>

        <div *ngIf="project.user_role"
             class="flex items-center gap-3 text-base text-color">
          <div class="w-2rem h-2rem border-round-3xl flex align-items-center justify-content-center"
               [ngClass]="getIconBgColor(project.id)">
            <i class="ph ph-tag text-xl"
               [ngClass]="getIconColor(project.id)"></i>
          </div>
          <span class="font-medium">{{ project.user_role.type }}</span>
        </div>

      </div>

      <!-- Stats -->
      <div class="mt-3">

        <div class="flex items-center justify-content-between text-base mb-2">
          <span class="text-color-secondary font-medium">Miembros:</span>
          <span class="font-bold text-xl"
                [ngClass]="getNumberColor(project.id)">
            {{ project.stats?.members_count || 0 }}
          </span>
        </div>

        <div class="flex items-center justify-content-between text-base mb-2">
          <span class="text-color-secondary font-medium">Proyecto ID:</span>
          <span class="font-bold text-xl"
                [ngClass]="getNumberColor(project.id)">
            #{{ project.id }}
          </span>
        </div>

        <!-- Progress bar adaptada -->
        <div class="w-full surface-border border-round h-2 mt-3 surface-ground">
          <div class="h-2 border-round"
               [ngClass]="getProgressBarColor(project.id)"
               style="width: 75%">
          </div>
        </div>

      </div>
    </div>

    <!-- Footer -->
    <ng-template pTemplate="footer">
      <div class="footer py-4 border-top-1 surface-border surface-section flex flex-row align-items-center justify-content-between">

        <div class="flex align-items-center gap-3">
          <div class="w-2rem h-2rem border-round-3xl flex align-items-center justify-content-center"
               [ngClass]="getIconBgColor(project.id)">
            <i class="ph ph-users-three text-xl"
               [ngClass]="getIconColor(project.id)"></i>
          </div>
        </div>

        <div class="flex align-items-center gap-4">

          <div *ngIf="project.created_at"
               class="text-base text-color-secondary">
            {{ project.created_at | date:'dd/MM/yyyy' }}
          </div>

          <div class="w-2rem h-2rem border-round-3xl flex align-items-center justify-content-center"
               [ngClass]="getIconBgColor(project.id)">
            <i class="ph ph-arrow-right text-xl"
               [ngClass]="getIconColor(project.id)"></i>
          </div>

        </div>
      </div>
    </ng-template>

  </p-card>
