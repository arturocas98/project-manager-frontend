<p-sidebar
  [(visible)]="visible"
  position="right"
  [transitionOptions]="'.3s cubic-bezier(0, 0, 0.2, 1)'"
  styleClass="layout-config-sidebar w-18rem"
>
  <h5>{{ 'general.scale' | translate }}</h5>
  <div class="flex align-items-center">
    <button
      icon="pi pi-minus"
      type="button"
      pButton
      (click)="decrementScale()"
      class="p-button-text p-button-rounded w-2rem h-2rem mr-2"
      [disabled]="scale === scales[NUMBERS.ZERO]"
    ></button>
    <div class="flex gap-2 align-items-center">
      <i
        class="pi pi-circle-fill"
        *ngFor="let s of scales"
        [ngClass]="{ 'text-[var(--primary-color)]': s === scale, 'text-300': s !== scale }"
      ></i>
    </div>
    <button
      icon="pi pi-plus"
      type="button"
      pButton
      (click)="incrementScale()"
      class="p-button-text p-button-rounded w-2rem h-2rem ml-2"
      [disabled]="scale === scales[scales.length - NUMBERS.ONE]"
    ></button>
  </div>

  <ng-container *ngIf="!minimal">
    <h5>{{ 'general.menuType' | translate }}</h5>
    <div class="flex flex-wrap row-gap-3">
      <div class="flex align-items-center gap-2 w-6">
        <p-radioButton name="menuMode" value="static" [(ngModel)]="menuMode" inputId="mode1"></p-radioButton>
        <label for="mode1">{{ 'general.static' | translate }}</label>
      </div>
      <div class="flex align-items-center gap-2 w-6">
        <p-radioButton name="menuMode" value="overlay" [(ngModel)]="menuMode" inputId="mode2"></p-radioButton>
        <label for="mode2">{{ 'general.overlay' | translate }}</label>
      </div>
      <div class="flex align-items-center gap-2 w-6">
        <p-radioButton name="menuMode" value="slim" [(ngModel)]="menuMode" inputId="mode3"></p-radioButton>
        <label for="mode3">{{ 'general.slim' | translate }}</label>
      </div>
      <div class="flex align-items-center gap-2 w-6">
        <p-radioButton name="menuMode" value="slim-plus" [(ngModel)]="menuMode" inputId="mode4"></p-radioButton>
        <label for="mode3">{{ 'general.slimPlus' | translate }}</label>
      </div>
      <div class="flex align-items-center gap-2 w-6">
        <p-radioButton name="menuMode" value="drawer" [(ngModel)]="menuMode" inputId="mode7"></p-radioButton>
        <label for="mode6">{{ 'general.drawer' | translate }}</label>
      </div>
    </div>
  </ng-container>

  <h5>{{ 'general.horizontal' | translate }}</h5>
  <div class="field-radiobutton">
    <p-radioButton name="colorScheme" value="light" [(ngModel)]="colorScheme" inputId="mode-light"></p-radioButton>
    <label for="mode-light">{{ 'general.light' | translate }}</label>
  </div>
  <div class="field-radiobutton">
    <p-radioButton name="colorScheme" value="dim" [(ngModel)]="colorScheme" inputId="mode-dim"></p-radioButton>
    <label for="mode-dim">{{ 'general.dim' | translate }}</label>
  </div>
  <div class="field-radiobutton">
    <p-radioButton name="colorScheme" value="dark" [(ngModel)]="colorScheme" inputId="mode-dark"></p-radioButton>
    <label for="mode-dark">{{ 'general.dark' | translate }}</label>
  </div>
</p-sidebar>
