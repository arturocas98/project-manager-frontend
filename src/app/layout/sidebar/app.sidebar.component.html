<div
    class="layout-sidebar w-25rem"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()">
  <a [routerLink]="['/']" class="app-logo">
    <div class="flex flex-row align-items-center justify-content-start">
      <div
        class="h-5rem flex flex-row align-items-center justify-content-start px-4 border-b border-gray-200 gap-3">
        <div class="w-3rem h-3rem flex align-items-center justify-content-center ">
          <img
            src="assets/General/SGR.png"
            alt="Logo SmartGob"
            class="w-4rem h-4rem object-contain rounded-lg block" />
        </div>
        <p class="text-black-alpha-90" style="font-size:1.5rem;">SmartGob</p>
      </div>
      <i class="ph ph-layout text-black-alpha-60 ml-auto p-4" style="font-size:2rem;"></i>
    </div>

    <hr class="border-t border-gray-200 my-0" />

    <button
      class="layout-sidebar-anchor p-link"
      type="button"
      (click)="anchor()"></button>
  </a>

  <div class="layout-menu-container px-3 py-0">
    <app-menu></app-menu>
  </div>
  <hr class="border-t border-gray-200 my-0" />
</div>
