<aside
        class="layout-sidebar overflow-x-visible  flex flex-col h-screen bg-gradient-to-b from-gray-50 to-gray-100
         border-r border-gray-300 w-72 transition-all duration-300 ease-in-out shadow-lg"
        (mouseenter)="onMouseEnter()"
        (mouseleave)="onMouseLeave()"
>

    <!-- Header -->
    <div class="h-4rem flex flex-row align-items-center justify-content-start px-4 border-b border-gray-200 gap-3">
        <div class="w-3rem h-3rem flex align-items-center justify-content-center">
            <img
                    src="assets/General/SGR.png"
                    alt="Logo SmartGob"
                    class="w-3rem h-3rem object-contain rounded-lg block"
            />
        </div>
        <p class="text-xl text-indigo-900">
            SmartGob
        </p>
    </div>

    <hr class="border-t border-gray-200 my-0">

    <!-- Menu -->
    <nav class="flex-1 overflow-visible px-3 py-3">

        <a class="flex align-items-center gap-3 px-3 py-2 rounded-lg text-gray-700 font-medium hover:bg-indigo-50 hover:text-indigo-500" style="cursor:pointer">
            <i class="ph ph-house"></i>
            <span>Dashboard</span>
        </a>

        <a class="flex align-items-center gap-3 px-3 py-2 rounded-lg text-gray-700 font-medium hover:bg-indigo-50 hover:text-indigo-500" (click)="recentsOverlay.toggle($event)" style="cursor:pointer">
            <i class="ph ph-clock"></i>
            <span>Recientes</span>
            <i class="ph ph-caret-right ml-auto"></i>
        </a>
        <a class="flex align-items-center gap-3 px-3 py-2 rounded-lg text-gray-700 font-medium hover:bg-indigo-50 hover:text-indigo-500" style="cursor:pointer">
            <i class="ph ph-star"></i>
            <span>Favoritos</span>
            <i class="ph ph-caret-right ml-auto"></i>
        </a>

        <a class="flex align-items-center gap-3 px-3 py-2 rounded-lg text-gray-700 font-medium hover:bg-indigo-50 hover:text-indigo-500" style="cursor:pointer">
            <i class="ph ph-projector-screen-chart"></i>
            <span>Planes</span>
        </a>

        <a class="flex align-items-center gap-3 px-3 py-2 rounded-lg text-gray-700 font-medium hover:bg-indigo-50 hover:text-indigo-500" style="cursor:pointer">
            <i class="ph ph-squares-four"></i>
            <span>Espacios</span>
        </a>

        <a class="flex align-items-center gap-3 px-3 py-2 rounded-lg text-gray-700 font-medium hover:bg-indigo-50 hover:text-indigo-500" style="cursor:pointer">
            <i class="ph ph-funnel-simple"></i>
            <span>Espacios</span>
        </a>

        <a class="flex align-items-center gap-3 px-3 py-2 rounded-lg text-gray-700 font-medium hover:bg-indigo-50 hover:text-indigo-500" style="cursor:pointer">
            <i class="ph ph-layout"></i>
            <span>Paneles</span>
        </a>
        <div class="my-3 border-t border-gray-200"></div>

        <hr class="border-t border-gray-200 my-3">

        <p class="px-3 text-xs font-semibold text-gray-400 uppercase">
            Mas
        </p>

        <a class="flex align-items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-indigo-500" style="cursor:pointer">
            <div class="w-3rem h-2rem border-round-2xl bg-indigo-100 flex align-items-center justify-content-center text-indigo-500">
                <i class="ph ph-person-simple-run"></i>
            </div>
            <span>Metas</span>
            <i class="ph ph-arrow-circle-right ml-auto text-xl"></i>
        </a>

        <a class="flex align-items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-indigo-500" style="cursor:pointer">
            <div class="w-3rem h-2rem border-round-2xl bg-indigo-100 flex align-items-center justify-content-center text-indigo-500">
                <i class="ph ph-users-three"></i>
            </div>
            <span>Equipos</span>
            <i class="ph ph-arrow-circle-right ml-auto text-xl"></i>
        </a>
        <a class="flex align-items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-indigo-500" style="cursor:pointer">
            <div class="w-3rem h-2rem border-round-2xl bg-indigo-100 flex align-items-center justify-content-center text-indigo-500">
                <i class="ph ph-rocket-launch"></i>
            </div>
            <span>Proyectos</span>
            <i class="ph ph-arrow-circle-right ml-auto text-xl"></i>
        </a>

        <a class="flex align-items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-gray-100" style="cursor:pointer">
            <div class="w-3rem h-2rem border-round-2xl bg-gray-200 flex align-items-center justify-content-center text-gray-800">
                <i class="ph ph-gear-six"></i>
            </div>
            <span>personaliza tu barra</span>
        </a>
    </nav>
</aside>
<p-overlayPanel #recentsOverlay>
    <div class="p-4">
        <p class="text-gray-700">
            Este es un texto de ejemplo básico que se muestra
            cuando haces clic en File.
        </p>
        <p class="text-sm text-blue-500 mt-2">
            Puedes poner cualquier contenido aquí.
        </p>
    </div>
</p-overlayPanel>
